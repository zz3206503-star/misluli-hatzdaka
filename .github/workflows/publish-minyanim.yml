name: Publish Minyanim
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Minyanim-v14.zip
      - .github/workflows/publish-minyanim.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Extract the app and verify the review pages
        run: |
          unzip -q Minyanim-v14.zip -d "$RUNNER_TEMP/minyanim"
          cd "$RUNNER_TEMP/minyanim"
          test -s index.html
          test -s places.json
          test -s Minyanim-Review.html
          test -s review/index.html
          test -s review/photos/1.webp
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/minyanim
      - id: deploy
        uses: actions/deploy-pages@v4
