name: Publish Minyanim

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Minyanim-v14.zip
      - .github/workflows/publish-minyanim.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - name: Extract and check version 15
        run: |
          unzip -q Minyanim-v14.zip -d site
          test -s site/editor.js
          grep -q 'id="exportEdits"' site/index.html
          grep -q 'גרסה 15' site/index.html
          test -s site/review/index.html

      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Wait until GitHub can see the uploaded site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..30}; do
            count=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" \
              --jq '[.artifacts[] | select(.expired == false)] | length') || count=0
            if [ "$count" -ge 1 ]; then
              exit 0
            fi
            sleep 5
          done
          echo "GitHub could not locate the uploaded site."
          exit 1

      - name: Publish site
        id: publish
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
